# Equipos recomendados por contenido (lo mantiene el administrador; viaja con las actualizaciones).
# Se muestran en la pagina Equipos en este orden: del mejor al que "pasa" con mas dificultad.
#
# Clave: el id de un destino del catalogo (lumen/modos/catalogo.py, p. ej. "perros_piso4") o el de un
# contenido entero ("perros" = sus otros pisos; "rata" = todos).
# nivel: recomendado | bueno | alternativa
# personajes: ids de lumen/datos/personajes.yaml, de izquierda a derecha como en el juego
# bot: true si el bot sabe jugar ese equipo
# alternativas: personaje -> otros que pueden ocupar su lugar
#
# Los equipos que no son de Lumen vienen de AutoFarming (BOTS_README). Cada heroe se identifico
# comparando las cartas de AutoFarming con las de los 361 heroes capturados (2026-10-27).

# Texto del boton cuando la clave es un contenido entero ("" = solo su nombre).
_pisos:
  rata: Floors 1–2
  serpiente: ""

# Heroes que salen en algun equipo pero no estan en la base (nadie los ha capturado aun): id -> nombre.
# Nicknames de AutoFarming ya resueltos: "LR Liz" = Princess Elizabeth roja [New Legend] (sello LR);
# "Margaret roja" = Covenant of Light Ludociel rojo [Summer Mirage] (Ludociel en el cuerpo de Margaret).
_nombres: {}

perros_piso4:
  - nombre: Equipo Lumen
    nivel: recomendado
    bot: true
    personajes: [odin, gawain, freyja_roja, thonar_azul]
    notas: >-
      El que juega el bot. Gana en unos 2,5 minutos y casi siempre en 4 turnos.
      Fase 1: Thonar quita la Stance y Freyja carga su Ultimate Move; Odin usa su Talent.
      Fase 2: se quita la Stance del perro de la burbuja y Gawain, Freyja y Odin atacan en area.
      Fase 3: no se ataca; el golpe extra de la Ultimate de Freyja termina la pelea.

  - nombre: Escalin y Meliodas Rey Demonio
    nivel: bueno
    personajes: [merlin_escanor_verde, demon_king_meliodas_azul, holy_knight_gowther_azul, herbalist_nasiens_verde]
    notas: >-
      Equipo "whale" de AutoFarming para el Floor 4: solo para cuentas y personajes muy fuertes.
      Meliodas Rey Demonio y Gowther con reliquia. Escalin y Meliodas con equipo de Ataque/Crítico;
      Gowther Ataque/Defensa (14,5 % o más en todo); Nasiens Vida/Defensa sin ninguna tirada de Vida
      en orbe y cinturón. Escalin debe ir en el puesto 3 o 4. Enlaces: Escalin > Roxy LR,
      Meliodas > Sabunak, Gowther > Tarmiel rojo, Nasiens > cualquiera menos Escanor UR.
      El bot todavía no sabe jugarlo.

  - nombre: Escalin y Roxy
    nivel: alternativa
    personajes: [merlin_escanor_verde, roxy_of_madness_azul, herbalist_nasiens_verde, wanderer_thonar_rojo]
    alternativas:
      roxy_of_madness_azul: [roxy_of_madness_rojo, lillia_of_desire_rojo, dual_swordsman_cusack_azul]
      wanderer_thonar_rojo: [thonar_azul]
    notas: >-
      Equipo de AutoFarming para la mayoría de jugadores. Pasa el Floor 4, pero falla más por suerte
      y pide jugar con cuidado. Roxy (mejor la azul) se puede cambiar por Lillia o Cusack, y Thonar rojo
      por el azul. El bot todavía no sabe jugarlo.

perros:
  - nombre: Escanor UR y Lostvayne
    nivel: recomendado
    personajes: [escanor_the_indomitable_verde, lostvayne_meliodas_rojo, sun_god_freyr_rojo, thonar_azul]
    alternativas:
      thonar_azul: [wanderer_thonar_rojo, wanderer_thonar_verde]
    notas: >-
      Floors 1 a 3 (de AutoFarming). Sirve casi cualquier equipo; este es el recomendado.
      Lostvayne con reliquia; Thonar con reliquia y equipo de Resistencia a críticos (mejor con True
      Awakening).

pajaro_piso4:
  - nombre: Meliodas Traidor y Thor
    nivel: recomendado
    personajes: [traitor_meliodas_oscuro, thor_the_god_of_thunder_azul, valkyrie_megellda_azul, shion_verde]
    alternativas:
      traitor_meliodas_oscuro: [god_of_war_tyr_verde]
    notas: >-
      Floor 4 de AutoFarming. Sirve cualquier equipo, pero este es el mejor. Meliodas Traidor se puede
      cambiar por Tyr verde. Si usas a Diane, ponla siempre en el puesto de la derecha.

ciervo_piso4:
  - nombre: Thor, Jormungand y Freyr
    nivel: recomendado
    personajes: [thor_the_god_of_thunder_azul, world_serpent_jormungand_verde, sun_god_freyr_rojo, god_of_war_tyr_verde]
    alternativas:
      god_of_war_tyr_verde: [repose_of_souls_hel_verde]
    notas: >-
      Floor 4 de AutoFarming. Todos con equipo de Ataque/Daño crítico, menos Jormungand (Ataque/Defensa).
      Tyr verde se puede cambiar por Hel verde. Hay que poder terminar la fase 1 en 3 turnos.
      Sin Skuld.

ciervo:
  - nombre: Jormungand, Freyr y Thor
    nivel: recomendado
    personajes: [world_serpent_jormungand_verde, sun_god_freyr_rojo, thor_the_god_of_thunder_azul, repose_of_souls_hel_verde]
    alternativas:
      repose_of_souls_hel_verde: [valkyrie_megellda_rojo, god_of_war_tyr_verde]
    notas: >-
      Floors 1 a 3 (de AutoFarming). Hel verde (recomendada) se puede cambiar por Megellda roja o Tyr
      verde. Sin Skuld.

serpiente:
  - nombre: Mael y Freyja
    nivel: recomendado
    personajes: [mael_of_sunshine_claro, covenant_of_light_ludociel_rojo, freyja_roja, princess_elizabeth_rojo]
    notas: >-
      De AutoFarming. Freyja con reliquia. Mael (el antiguo) se puede cambiar por Tristan.
      "Margaret roja" es el Ludociel de verano (rojo) y "LR Liz" la Princess Elizabeth LR (roja).

  - nombre: Jinwoo y Cha Hae-In
    nivel: bueno
    personajes: [monarch_of_shadows_sung_jinwoo_oscuro, herbalist_nasiens_verde, the_dancer_cha_hae_ln_azul, urek_mazino_azul]
    notas: >-
      Equipo "whale" de AutoFarming: muy rápido pero arriesgado; pide una cuenta muy fuerte (16M+ de
      Combat Class y la 6.ª constelación). Todos con reliquia. Jinwoo, Cha y Urek con equipo de
      Ataque/Daño crítico (14,5 % o más); Nasiens Vida/Defensa. Cha Hae-In tiene que ser la de menos
      Vida del equipo. Enlaces: Roxy en Jinwoo, Escanor UR o Skuld en Nasiens, Tarmiel rojo en Cha,
      Sabunak en Urek.

rata:
  - nombre: Liz, Valenti y Jormungand
    nivel: recomendado
    personajes: [princess_elizabeth_rojo, valenti_of_obsession_azul, world_serpent_jormungand_rojo, king_diane_azul]
    alternativas:
      king_diane_azul: [merlin_escanor_verde]
    notas: >-
      Floors 1 y 2 (de AutoFarming). King & Diane se puede cambiar por Escalin; si usas a King & Diane,
      ponlos en el puesto de la derecha.
