# Lo que se puede conseguir en cada contenido, sacado de la ventana "Recompensa" del juego.
# Lo muestra Inicio bajo la rueda ("Puedes conseguir"). Los iconos estan en assets/premios/<objeto>.png.
#
# objetos: id -> nombre y descripcion (tal como salen en el juego)
# <id del destino del catalogo>:
#   primera_vez: lo que da la primera vez que se supera (una sola vez)
#   garantizados: lo que da siempre, en cada victoria
#   premios: cada linea de la tabla del juego; prob = % que pone el juego (ya es sobre el total)

objetos:
  magnificencia_valhalla:
    nombre: Magnificencia del Valhalla
    descripcion: Una gema brillante que recuerda al Valhalla. Obtenida de Hraesvelgr en batalla de bestia demoníaca.
  origen_vientos:
    nombre: Origen de los vientos
    descripcion: Un objeto necesario para fabricar reliquias sagradas. Obtenido de Hraesvelgr en batalla de bestia demoníaca.
  carta_hraesvelgr:
    nombre: Hraesvelgr
    descripcion: Carta de artefacto de Hraesvelgr.
  esencia_desconocida:
    nombre: Esencia mágica desconocida
    descripcion: Esencia mágica usada para fabricar reliquias sagradas para hadas, gigantes y razas desconocidas.
  pluma_hraesvelgr:
    nombre: Pluma de Hraesvelgr
    descripcion: Una pluma espléndida de Hraesvelgr. Sirve para mejorar reliquias sagradas.
  orbe_hraesvelgr:
    nombre: Orbe de Hraesvelgr
    descripcion: Un orbe que contiene el poder de Hraesvelgr. Sirve para mejorar reliquias sagradas.
  mural_antiguo:
    nombre: Mural antiguo
    descripcion: Carta especial Mural antiguo.
  campo_hraesvelgr:
    nombre: Campo de batalla de Hraesvelgr
    descripcion: Carta de escena del campo de batalla de Hraesvelgr.
  sublimidad_valquirias:
    nombre: Sublimidad de las valquirias
    descripcion: Una gema de gran calidad que simboliza nobles intenciones. Obtenida de Eikthyrnir en batalla de bestia demoníaca.
  origen_rios:
    nombre: Origen de los ríos
    descripcion: Un objeto necesario para fabricar reliquias sagradas. Obtenido de Eikthyrnir en batalla de bestia demoníaca.
  carta_eikthyrnir:
    nombre: Eikthyrnir
    descripcion: Carta de artefacto de Eikthyrnir.
  meticulosidad_eitri:
    nombre: Meticulosidad de Eitri
    descripcion: Pizarra que contiene la meticulosidad de Eitri. Obtenida en la tienda de intercambio de la Torre del Árbol del Mundo.
  esencia_dorada:
    nombre: Esencia mágica dorada
    descripcion: Esencia mágica usada para fabricar reliquias sagradas para diosas.
  asta_eikthyrnir:
    nombre: Asta rota de Eikthyrnir
    descripcion: Una de las numerosas astas de Eikthyrnir. Sirve para mejorar reliquias sagradas.
  orbe_eikthyrnir:
    nombre: Orbe de Eikthyrnir
    descripcion: Un orbe que contiene el poder de Eikthyrnir. Sirve para mejorar reliquias sagradas.
  campamento_aliadas:
    nombre: Campamento de las fuerzas aliadas
    descripcion: Carta de escena del campamento de las fuerzas aliadas.
  honor_einheriar:
    nombre: Honor del Einheriar
    descripcion: Una gema rara concedida solo a los más honorables de los guerreros. Se obtiene de Skoll y Hati en batalla de bestia demoníaca.
  fuente_ocaso:
    nombre: Fuente del ocaso
    descripcion: Objeto necesario para fabricar reliquias sagradas. Se obtiene de Skoll y Hati en batalla de bestia demoníaca.
  carta_hati:
    nombre: Hati
    descripcion: Carta de artefacto de Hati.
  carta_skoll:
    nombre: Skoll
    descripcion: Carta de artefacto de Skoll.
  fuerza_brok:
    nombre: Fuerza de Brok
    descripcion: Una pizarra que contiene la fuerza de Brok.
  esencia_negra:
    nombre: Esencia mágica negra
    descripcion: Esencia mágica usada para fabricar reliquias sagradas para demonios.
  garra_skoll_hati:
    nombre: Garra de Skoll y Hati
    descripcion: Una de las garras de Skoll y Hati. Sirve para mejorar reliquias sagradas.
  orbe_skoll_hati:
    nombre: Orbe de Skoll y Hati
    descripcion: Orbe que contiene el poder de Skoll y Hati. Sirve para mejorar reliquias sagradas.
  cristal_rojo_oscuro:
    nombre: Cristal rojo oscuro
    descripcion: Un mineral precioso que simboliza la inmensidad infinita de la tierra de la oscuridad. Se consigue en la batalla de bestia demoníaca contra Nidhoggr.
  origen_raices:
    nombre: Origen de la corrupción de las raíces
    descripcion: Un objeto necesario para fabricar reliquias sagradas. Obtenido de Nidhoggr en batalla de bestia demoníaca.
  carta_nidhoggr:
    nombre: Nidhoggr
    descripcion: Carta de artefacto de Nidhoggr.
  tenacidad_volundr:
    nombre: Tenacidad de Volundr
    descripcion: Pizarra que contiene la tenacidad de Volundr. Obtenida en la tienda de intercambio de la Torre del Árbol del Mundo.
  fruto_yggdrasil:
    nombre: Fruto del Yggdrasil
    descripcion: Fruto místico que atesora Ratatoskr. Ratatoskr lo proporciona en Batalla de bestia demoníaca.
  origen_ciclo:
    nombre: Origen del ciclo
    descripcion: Objeto necesario para fabricar reliquias sagradas. Ratatoskr lo proporciona en Batalla de bestia demoníaca.
  runa_magica:
    nombre: Runa mágica
    descripcion: Runa hallada en el Salón del Génesis. Se puede obtener en la batalla de bestia demoníaca de Surtr y la llama primordial.
  origen_fuego:
    nombre: Origen del fuego
    descripcion: Objeto necesario para fabricar reliquias sagradas. Se puede obtener en la batalla de bestia demoníaca de Surtr y la llama primordial.
  esencia_azul:
    nombre: Esencia mágica azul
    descripcion: Esencia mágica usada para fabricar reliquias sagradas para héroes [humanos y hadas], [humanos] y de [raza desconocida].

pajaro_pisos1a3:  # captura del juego, 2026-10-28
  primera_vez:
    - {objeto: magnificencia_valhalla, cantidad: 2}
    - {objeto: origen_vientos}
  premios:
    - {caja: oro, objeto: carta_hraesvelgr, prob: 0.2}
    - {caja: oro, objeto: magnificencia_valhalla, prob: 10}
    - {caja: plata, objeto: esencia_desconocida, cantidad: 5, prob: 20}
    - {caja: plata, objeto: esencia_azul, cantidad: 5, prob: 20}
    - {caja: bronce, objeto: esencia_desconocida, cantidad: 2, prob: 24.9}
    - {caja: bronce, objeto: esencia_azul, cantidad: 2, prob: 24.9}

pajaro_piso4:  # captura del juego, 2026-10-28 (la cantidad de la pluma de la caja de oro no se veia: 4, como en Skoll y Hati)
  garantizados:
    - {objeto: pluma_hraesvelgr}
    - {objeto: orbe_hraesvelgr}
  premios:
    - {caja: oro, objeto: mural_antiguo, prob: 0.1}
    - {caja: oro, objeto: carta_hraesvelgr, prob: 1.4}
    - {caja: oro, objeto: pluma_hraesvelgr, cantidad: 4, prob: 9}
    - {caja: plata, objeto: campo_hraesvelgr, prob: 2.5}
    - {caja: plata, objeto: pluma_hraesvelgr, cantidad: 2, prob: 25}
    - {caja: bronce, objeto: pluma_hraesvelgr, prob: 15}
    - {caja: bronce, objeto: esencia_desconocida, cantidad: 15, prob: 23.5}
    - {caja: bronce, objeto: esencia_azul, cantidad: 15, prob: 23.5}

