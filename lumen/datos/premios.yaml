# Lo que se puede conseguir en cada contenido, sacado de la ventana "Recompensa" del juego.
# Lo muestran Inicio y Farmear (fila "Metas") y sirve para las metas de material. Los iconos estan en assets/premios/<objeto>.png.
#
# objetos: id -> nombre y descripcion (tal como salen en el juego) y su id en la galeria del inventario
#   (lumen/datos/galeria_objetos.yaml), si esta: une el botin con estas tablas (recompensas.vincular_premios)
# <id del destino del catalogo>:
#   primera_vez: lo que da la primera vez que se supera (una sola vez)
#   garantizados: lo que da siempre, en cada victoria
#   lider: lo que da solo al lider del grupo (en los demonios; el bot se une a grupos de otros, asi que no se muestra)
#   premios: cada linea de la tabla del juego; prob = % que pone el juego (ya es sobre el total)

