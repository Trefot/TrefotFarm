  premios:
    - {caja: oro, objeto: mural_antiguo, prob: 0.1}
    - {caja: oro, objeto: carta_eikthyrnir, prob: 1.4}
    - {caja: oro, objeto: asta_eikthyrnir, prob: 9}
    - {caja: plata, objeto: campamento_aliadas, prob: 2.5}
    - {caja: plata, objeto: asta_eikthyrnir, cantidad: 2, prob: 25}
